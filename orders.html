<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders - ChemistBoys</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .orders-page {
            min-height: 70vh;
            padding: 60px 0;
            background: #f5fbfa;
        }

        .orders-title {
            text-align: center;
            color: #075f55;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .orders-subtitle {
            text-align: center;
            color: #718987;
            margin-bottom: 40px;
        }

        .orders-container {
            max-width: 900px;
            margin: auto;
        }

        .order-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #e1efec;
            box-shadow: 0 8px 25px rgba(0, 80, 70, 0.07);
            transition: 0.3s;
        }

        .order-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(0, 80, 70, 0.12);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #e5efed;
            padding-bottom: 15px;
            margin-bottom: 18px;
        }

        .order-id {
            font-weight: 800;
            color: #075f55;
            font-size: 18px;
        }

        .order-status {
            padding: 8px 14px;
            border-radius: 30px;
            background: #dff8f3;
            color: #087c6b;
            font-size: 14px;
            font-weight: 700;
        }

        .order-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .order-info p {
            color: #526d69;
        }

        .order-items {
            background: #f7fcfb;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            color: #365853;
        }

        .order-total {
            text-align: right;
            font-size: 20px;
            font-weight: 800;
            color: #075f55;
        }

        .empty-orders {
            text-align: center;
            background: white;
            padding: 60px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 80, 70, 0.06);
        }

        .empty-orders-icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        .empty-orders h2 {
            color: #075f55;
            margin-bottom: 10px;
        }

        .empty-orders p {
            color: #718987;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;
            background: #0ca88f;
            color: white;
            padding: 13px 25px;
            border-radius: 12px;
            font-weight: 700;
        }

        .shop-btn:hover {
            background: #087c6b;
        }

        @media (max-width: 600px) {

            .orders-page {
                padding: 40px 0;
            }

            .orders-title {
                font-size: 30px;
            }

            .order-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .order-info {
                grid-template-columns: 1fr;
            }

            .order-item {
                gap: 15px;
            }

        }
/* ==============================
   CLEAN MY ORDERS DESIGN
   ============================== */

.order-card {
    overflow: hidden;
}

.order-header {
    min-height: 58px;
    align-items: center !important;
}

.order-heading-left {
    min-width: 0;
}

.order-id {
    font-size: 20px;
    line-height: 1.25;
}

.order-date {
    margin-top: 5px;
    color: #718987;
    font-size: 14px;
}

.order-status-wrap {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.order-status {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    padding: 9px 15px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 800;
    line-height: 1;
}

.order-status.processing {
    background: #fff3cd;
    color: #856404;
}

.order-status.accepted {
    background: #dff8f3;
    color: #087c6b;
}

.order-status.cancelled {
    background: #f8d7da;
    color: #b42318;
}

.order-items {
    margin-top: 5px;
}

.order-item {
    display: flex;
    align-items: center;
    gap: 15px;
    min-height: 42px;
}

.order-item-name {
    flex: 1;
    font-weight: 700;
}

.order-item-price {
    flex-shrink: 0;
    font-weight: 600;
    white-space: nowrap;
}

.order-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding-top: 5px;
}

.order-total {
    text-align: left;
}

.order-payment {
    color: #526d69;
    font-size: 14px;
    text-align: right;
}

.delivery-date-box {
    display: flex;
    align-items: center;
    gap: 6px;
    width: fit-content;
    max-width: 100%;
    margin: 0 0 18px;
    padding: 10px 14px;
    border-radius: 12px;
    background: #edf9f6;
    color: #087c6b;
    font-size: 14px;
}

@media (max-width: 600px) {

    .order-header {
        flex-direction: row !important;
        align-items: center !important;
    }

    .order-id {
        font-size: 18px;
    }

    .order-status {
        padding: 8px 11px;
        font-size: 12px;
    }

    .order-item {
        align-items: flex-start;
    }

    .order-item-price {
        font-size: 13px;
    }

    .order-summary {
        flex-direction: column;
        align-items: flex-start;
    }

    .order-payment {
        text-align: left;
    }

    .delivery-date-box {
        font-size: 13px;
    }
}

    </style>

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="container">

            <div class="header-top">

                <a
                    href="index.html"
                    class="logo-link"
                >

                    <div class="logo">

                        <span class="logo-icon">
                            💊
                        </span>

                        <span class="logo-text">
                            ChemistBoys
                        </span>

                    </div>

                </a>


                <div class="header-actions">

                    <a
                        href="index.html"
                        class="account-btn"
                    >
                        🏠 Home
                    </a>

                    <a
                        href="cart.html"
                        class="cart-btn"
                    >
                        🛒 Cart
                    </a>

                </div>

            </div>

        </div>

    </header>


    <!-- MY ORDERS -->

    <main class="orders-page">

        <div class="container">

            <h1 class="orders-title">
                📦 My Orders
            </h1>

            <p class="orders-subtitle">
                Track and manage your medicine orders
            </p>


            <div
                class="orders-container"
                id="ordersContainer"
            >

                <!-- Orders will be loaded here -->

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">

                <p>
                    &copy; 2026 ChemistBoys.
                    All rights reserved.
                </p>

            </div>

        </div>

    </footer>


    <script type="module" src="orders.js"></script>
</body>

</html>
