<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Panel - ChemistBoys</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            background: #f4fbf9;
        }

        .admin-page {
            min-height: 80vh;
            padding: 40px 20px;
        }

        .admin-container {
            max-width: 1000px;
            margin: auto;
        }

        .admin-header {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .admin-header h1 {
            margin: 0;
            color: #075f55;
        }

        .admin-header p {
            margin: 5px 0 0;
            color: #718987;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .admin-btn {
            padding: 11px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
        }

        .home-btn {
            background: #0ca88f;
            color: white;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
        }

        .orders-container {
            width: 100%;
        }

        .admin-order-card {
            width: 100%;
        }

        .loading {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 18px;
            color: #075f55;
        }

        @media(max-width:600px) {

            .admin-page {
                padding: 25px 12px;
            }

            .admin-header {
                padding: 20px;
            }

            .admin-header h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="container">

            <div class="header-top">

                <a
                    href="index.html"
                    class="logo-link"
                >

                    <div class="logo">

                        <span class="logo-icon">
                            💊
                        </span>

                        <span class="logo-text">
                            ChemistBoys
                        </span>

                    </div>

                </a>

            </div>

        </div>

    </header>



    <!-- ADMIN PAGE -->

    <main class="admin-page">

        <div class="admin-container">


            <!-- ADMIN HEADER -->

            <div class="admin-header">

                <div>

                    <h1>
                        🛠️ Admin Panel
                    </h1>

                    <p>
                        Manage ChemistBoys customer orders
                    </p>

                </div>


                <div class="admin-actions">

                    <a
                        href="index.html"
                        class="admin-btn home-btn"
                    >
                        🏠 Home
                    </a>


                    <button
                        type="button"
                        class="admin-btn logout-btn"
                        onclick="logoutAdmin()"
                    >
                        🚪 Logout
                    </button>

                </div>

            </div>



            <!-- ORDERS -->

            <div
                id="ordersContainer"
                class="orders-container"
            >

                <div class="loading">

                    <h2>
                        🔄 Loading Orders...
                    </h2>

                    <p>
                        Please wait.
                    </p>

                </div>

            </div>


        </div>

    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">

                <p>
                    &copy; 2026 ChemistBoys.
                    All rights reserved.
                </p>

            </div>

        </div>

    </footer>



    <!-- ADMIN JAVASCRIPT -->

    <script
        type="module"
        src="admin.js"
    ></script>


</body>

</html>
