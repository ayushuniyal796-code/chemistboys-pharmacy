<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Panel - ChemistBoys</title>

    <link rel="stylesheet" href="style.css">

    <style>

.delivery-modal {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 40, 35, 0.55);
    backdrop-filter: blur(5px);
}

.delivery-modal-box {
    position: relative;
    width: 100%;
    max-width: 430px;
    box-sizing: border-box;
    background: white;
    padding: 30px;
    border-radius: 22px;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
}

.delivery-close {
    position: absolute;
    top: 12px;
    right: 15px;
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: #f1f5f4;
    color: #075f55;
    font-size: 26px;
    cursor: pointer;
}

.delivery-icon {
    font-size: 42px;
    margin-bottom: 10px;
}

.delivery-modal-box h2 {
    margin: 0 0 8px;
    color: #075f55;
}

.delivery-modal-box p {
    margin: 0 0 22px;
    color: #718987;
}

.delivery-modal-box label {
    display: block;
    margin-bottom: 8px;
    color: #365853;
    font-weight: 700;
}

#deliveryDateInput {
    width: 100%;
    box-sizing: border-box;
    padding: 13px 14px;
    border: 2px solid #dcece8;
    border-radius: 12px;
    background: #f9fdfc;
    color: #164f48;
    font-size: 16px;
    outline: none;
}

#deliveryDateInput:focus {
    border-color: #0ca88f;
}

.delivery-modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
}

.delivery-modal-actions button {
    flex: 1;
    border: none;
    padding: 13px 15px;
    border-radius: 11px;
    font-weight: 800;
    cursor: pointer;
}

.delivery-cancel-btn {
    background: #eef3f2;
    color: #526d69;
}

.delivery-confirm-btn {
    background: #0ca88f;
    color: white;
}

.delivery-confirm-btn:hover {
    background: #087c6b;
}

.delivery-confirm-btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
}

@media (max-width: 500px) {

    .delivery-modal-box {
        padding: 25px 20px;
    }

    .delivery-modal-actions {
        flex-direction: column;
    }

}

        body {
            background: #f4fbf9;
        }

        .admin-page {
            min-height: 80vh;
            padding: 40px 20px;
        }

        .admin-container {
            max-width: 1000px;
            margin: auto;
        }

        .admin-header {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .admin-header h1 {
            margin: 0;
            color: #075f55;
        }

        .admin-header p {
            margin: 5px 0 0;
            color: #718987;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .admin-btn {
            padding: 11px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
        }

        .home-btn {
            background: #0ca88f;
            color: white;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
        }

        .orders-container {
            width: 100%;
        }

        .admin-order-card {
            width: 100%;
        }

        .loading {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 18px;
            color: #075f55;
        }

        @media(max-width:600px) {

            .admin-page {
                padding: 25px 12px;
            }

            .admin-header {
                padding: 20px;
            }

            .admin-header h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="container">

            <div class="header-top">

                <a
                    href="index.html"
                    class="logo-link"
                >

                    <div class="logo">

                        <span class="logo-icon">
                            💊
                        </span>

                        <span class="logo-text">
                            ChemistBoys
                        </span>

                    </div>

                </a>

            </div>

        </div>

    </header>



    <!-- ADMIN PAGE -->

    <main class="admin-page">

        <div class="admin-container">


            <!-- ADMIN HEADER -->

            <div class="admin-header">

                <div>

                    <h1>
                        🛠️ Admin Panel
                    </h1>

                    <p>
                        Manage ChemistBoys customer orders
                    </p>

                </div>


                <div class="admin-actions">

                    <a
                        href="index.html"
                        class="admin-btn home-btn"
                    >
                        🏠 Home
                    </a>


                    <button
                        type="button"
                        class="admin-btn logout-btn"
                        onclick="logoutAdmin()"
                    >
                        🚪 Logout
                    </button>

                </div>

            </div>



            <!-- ORDERS -->

            <div
                id="ordersContainer"
                class="orders-container"
            >

                <div class="loading">

                    <h2>
                        🔄 Loading Orders...
                    </h2>

                    <p>
                        Please wait.
                    </p>

                </div>

            </div>


        </div>

    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">

                <p>
                    &copy; 2026 ChemistBoys.
                    All rights reserved.
                </p>

            </div>

        </div>

    </footer>



    <!-- ADMIN JAVASCRIPT -->

 <script
    type="module"
    src="admin.js?v=40"
></script>

</body>

</html>
