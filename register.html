<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - ChemistBoys</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            background: rgba(255,255,255,.94);
            backdrop-filter: blur(20px);
            padding: 38px;
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(0,80,70,.14);
        }

        .auth-logo {
            text-align: center;
            font-size: 50px;
        }

        .auth-title {
            text-align: center;
            color: #075f55;
            margin: 10px 0 5px;
        }

        .auth-subtitle {
            text-align: center;
            color: #718987;
            margin-bottom: 28px;
        }

        .auth-group {
            margin-bottom: 20px;
        }

        .auth-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .auth-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d5e8e4;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            box-sizing: border-box;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 13px;
            background: #0ca88f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-message {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            min-height: 20px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #718987;
        }

        .auth-footer a {
            color: #0ca88f;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>


<body>

<header class="header">

    <div class="container">

        <div class="header-top">

            <a
                href="index.html"
                style="text-decoration:none;"
            >

                <div class="logo">

                    <span class="logo-icon">
                        💊
                    </span>

                    <span class="logo-text">
                        ChemistBoys
                    </span>

                </div>

            </a>

        </div>

    </div>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            💊
        </div>

        <h1 class="auth-title">
            Create Account
        </h1>

        <p class="auth-subtitle">
            Create your ChemistBoys account
        </p>


        <form id="registerForm">

            <div class="auth-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="auth-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="auth-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <span
                        class="show-password"
                        id="showPassword"
                    >
                        👁️
                    </span>

                </div>

            </div>


            <div class="auth-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-btn"
            >
                📝 Create Account
            </button>


            <div
                class="auth-message"
                id="authMessage"
            ></div>

        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</main>


<script
    type="module"
    src="auth.js"
></script>

</body>

</html>
