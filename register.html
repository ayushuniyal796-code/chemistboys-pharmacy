<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - ChemistBoys</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 470px;
            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(20px);
            padding: 35px;
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(0,80,70,0.14);
            animation: authAppear .7s ease;
        }

        @keyframes authAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .auth-logo {
            text-align: center;
            font-size: 45px;
        }

        .auth-title {
            text-align: center;
            color: #075f55;
            margin: 10px 0 5px;
        }

        .auth-subtitle {
            text-align: center;
            color: #718987;
            margin-bottom: 25px;
        }

        .auth-group {
            margin-bottom: 17px;
        }

        .auth-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .auth-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d5e8e4;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            transition: .3s;
        }

        .auth-group input:focus {
            border-color: #0ca88f;
            box-shadow: 0 0 0 4px rgba(12,168,143,.1);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 13px;
            background: #0ca88f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        .auth-btn:hover {
            background: #075f55;
            transform: translateY(-2px);
        }

        .auth-message {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            min-height: 20px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            color: #718987;
        }

        .auth-footer a {
            color: #0ca88f;
            font-weight: bold;
            text-decoration: none;
        }

        .password-hint {
            font-size: 12px;
            color: #718987;
            margin-top: 6px;
        }
    </style>
</head>

<body>

<header class="header">

    <div class="container">

        <div class="header-top">

            <a href="index.html" style="text-decoration:none;">
                <div class="logo">
                    <span class="logo-icon">💊</span>
                    <span class="logo-text">ChemistBoys</span>
                </div>
            </a>

        </div>

    </div>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">💊</div>

        <h1 class="auth-title">
            Create Account
        </h1>

        <p class="auth-subtitle">
            Join ChemistBoys today
        </p>


        <form id="registerForm">

            <div class="auth-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="auth-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="auth-group">

                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create password"
                        minlength="6"
                        required
                    >

                    <span
                        class="show-password"
                        id="showPassword"
                    >
                        👁️
                    </span>

                </div>

                <div class="password-hint">
                    Minimum 6 characters
                </div>

            </div>


            <div class="auth-group">

                <label>Confirm Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required
                    >

                    <span
                        class="show-password"
                        id="showConfirmPassword"
                    >
                        👁️
                    </span>

                </div>

            </div>


            <button
                type="submit"
                class="auth-btn"
            >
                🚀 Create Account
            </button>


            <div
                class="auth-message"
                id="authMessage"
            ></div>

        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</main>


<script type="module" src="auth.js"></script>
</body>
</html>
