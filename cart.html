<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart - ChemistBoys</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .cart-page {
            min-height: 70vh;
            padding: 50px 0;
            background: #f5fbfa;
        }

        .cart-title {
            text-align: center;
            color: #075f55;
            font-size: 36px;
            margin-bottom: 35px;
        }

        .cart-layout {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 25px;
        }

        .cart-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 80, 70, 0.08);
        }

        .cart-card h2 {
            color: #075f55;
            margin-bottom: 20px;
        }

        .cart-product {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 18px 0;
            border-bottom: 1px solid #e7efed;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-size: 17px;
            font-weight: 700;
            color: #244d48;
            margin-bottom: 6px;
        }

        .product-price {
            color: #087c6b;
            font-weight: 700;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            background: #e4f5f1;
            color: #075f55;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .quantity-btn:hover {
            background: #0ca88f;
            color: white;
        }

        .quantity-number {
            min-width: 25px;
            text-align: center;
            font-weight: 700;
        }

        .remove-btn {
            border: none;
            background: #fff0f0;
            color: #d33;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .remove-btn:hover {
            background: #ffdede;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            color: #526d69;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #dceae7;
            margin-top: 12px;
            padding-top: 17px;
            font-size: 22px;
            font-weight: 800;
            color: #075f55;
        }

        .checkout-btn {
            display: block;
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #0ca88f;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-sizing: border-box;
        }

        .checkout-btn:hover {
            background: #087c6b;
            transform: translateY(-2px);
        }

        .continue-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #087c6b;
            font-weight: 600;
            text-decoration: none;
        }

        .empty-cart {
            max-width: 650px;
            margin: 50px auto;
            background: white;
            padding: 60px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 80, 70, 0.08);
        }

        .empty-cart-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .empty-cart h2 {
            color: #075f55;
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #718987;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;
            background: #0ca88f;
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 11px;
            font-weight: 700;
        }

        .shop-btn:hover {
            background: #087c6b;
        }

        @media (max-width: 750px) {

            .cart-page {
                padding: 35px 0;
            }

            .cart-title {
                font-size: 30px;
            }

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-product {
                flex-wrap: wrap;
            }

        }

    </style>

</head>


<body>


    <!-- ================================
         HEADER
    ================================= -->

    <header class="header">

        <div class="container">

            <div class="header-top">


                <!-- LOGO -->

                <a
                    href="index.html"
                    class="logo-link"
                >

                    <div class="logo">

                        <span class="logo-icon">
                            💊
                        </span>

                        <span class="logo-text">
                            ChemistBoys
                        </span>

                    </div>

                </a>


                <!-- HEADER BUTTONS -->

                <div class="header-actions">

                    <a
                        href="index.html"
                        class="account-btn"
                    >
                        🏠 Home
                    </a>

                    <a
                        href="orders.html"
                        class="account-btn"
                    >
                        📦 My Orders
                    </a>

                </div>

            </div>


            <!-- NAVBAR -->

            <nav class="navbar">

                <a
                    href="index.html"
                    class="nav-link"
                >
                    Home
                </a>

                <a
                    href="index.html#products"
                    class="nav-link"
                >
                    All Medicines
                </a>

                <a
                    href="index.html#vitamins"
                    class="nav-link"
                >
                    Vitamins
                </a>

                <a
                    href="index.html#firstaid"
                    class="nav-link"
                >
                    First Aid
                </a>

                <a
                    href="index.html#offers"
                    class="nav-link"
                >
                    Offers
                </a>

            </nav>

        </div>

    </header>



    <!-- ================================
         CART PAGE
    ================================= -->

    <main class="cart-page">

        <div class="container">

            <h1 class="cart-title">
                🛒 Your Shopping Cart
            </h1>


            <div
                class="cart-layout"
                id="cartLayout"
            >


                <!-- CART PRODUCTS -->

                <div class="cart-card">

                    <h2>
                        Your Items
                    </h2>

                    <div
                        id="cartItems"
                    >
                        <!-- Products loaded by cart.js -->
                    </div>

                </div>



                <!-- ORDER SUMMARY -->

                <div class="cart-card">

                    <h2>
                        Order Summary
                    </h2>


                    <div class="summary-row">

                        <span>
                            Items
                        </span>

                        <strong id="totalItems">
                            0
                        </strong>

                    </div>


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <strong id="subtotal">
                            ₹0
                        </strong>

                    </div>


                    <div class="summary-row">

                        <span>
                            Delivery
                        </span>

                        <strong id="deliveryCharge">
                            ₹0
                        </strong>

                    </div>


                    <div class="summary-total">

                        <span>
                            Total
                        </span>

                        <span id="grandTotal">
                            ₹0
                        </span>

                    </div>


                    <!-- CHECKOUT -->

                    <a
                        href="checkout.html"
                        class="checkout-btn"
                        id="checkoutBtn"
                    >
                        🔒 Proceed to Checkout
                    </a>


                    <a
                        href="index.html"
                        class="continue-btn"
                    >
                        ← Continue Shopping
                    </a>

                </div>

            </div>

        </div>

    </main>



    <!-- ================================
         FOOTER
    ================================= -->

    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">

                <p>
                    &copy; 2026 ChemistBoys.
                    All rights reserved.
                </p>

            </div>

        </div>

    </footer>



    <!-- CART JAVASCRIPT -->

    <script src="cart.js"></script>


</body>

</html>
