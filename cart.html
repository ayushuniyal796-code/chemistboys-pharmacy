<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart - ChemistBoys</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="header">

        <div class="container">

            <div class="header-top">


                <!-- LOGO -->

                <a
                    href="index.html"
                    class="logo-link"
                >

                    <div class="logo">

                        <span class="logo-icon">
                            💊
                        </span>

                        <span class="logo-text">
                            ChemistBoys
                        </span>

                    </div>

                </a>



                <!-- HEADER ACTIONS -->

                <div class="header-actions">

                    <a
                        href="index.html"
                        class="account-btn"
                    >
                        🏠 Home
                    </a>


                    <a
                        href="orders.html"
                        class="account-btn"
                    >
                        📦 My Orders
                    </a>

                </div>

            </div>



            <!-- NAVIGATION -->

            <nav class="navbar">

                <a
                    href="index.html"
                    class="nav-link"
                >
                    Home
                </a>


                <a
                    href="index.html#products"
                    class="nav-link"
                >
                    All Medicines
                </a>


                <a
                    href="index.html#vitamins"
                    class="nav-link"
                >
                    Vitamins
                </a>


                <a
                    href="index.html#firstaid"
                    class="nav-link"
                >
                    First Aid
                </a>


                <a
                    href="index.html#offers"
                    class="nav-link"
                >
                    Offers
                </a>


                <a
                    href="about.html"
                    class="nav-link"
                >
                    About
                </a>

            </nav>

        </div>

    </header>



    <!-- =================================================
         CART PAGE
    ================================================== -->

    <main class="cart-page">

        <div class="container">


            <h1 class="cart-title">
                🛒 Your Shopping Cart
            </h1>



            <div class="cart-layout">


                <!-- =================================================
                     CART ITEMS
                ================================================== -->

                <div class="cart-card">

                    <h2>
                        Your Items
                    </h2>


                    <div id="cartItems">

                        <!--
                            Cart products are loaded
                            automatically by cart.js.
                        -->

                    </div>

                </div>



                <!-- =================================================
                     ORDER SUMMARY
                ================================================== -->

                <div class="cart-card">

                    <h2>
                        Order Summary
                    </h2>



                    <!-- ITEMS -->

                    <div class="summary-row">

                        <span>
                            Items
                        </span>

                        <strong id="totalItems">
                            0
                        </strong>

                    </div>



                    <!-- SUBTOTAL -->

                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <strong id="subtotal">
                            ₹0
                        </strong>

                    </div>



                    <!-- DELIVERY -->

                    <div class="summary-row">

                        <span>
                            Delivery
                        </span>

                        <strong id="deliveryCharge">
                            FREE
                        </strong>

                    </div>



                    <!-- TOTAL -->

                    <div class="summary-total">

                        <span>
                            Total
                        </span>

                        <span id="grandTotal">
                            ₹0
                        </span>

                    </div>



                    <!-- =================================================
                         BUY NOW
                    ================================================== -->

                    <a
                        href="checkout.html"
                        class="checkout-btn"
                        id="checkoutBtn"
                    >
                        🛒 Buy Now
                    </a>



                    <!-- CONTINUE SHOPPING -->

                    <a
                        href="index.html"
                        class="continue-btn"
                    >
                        ← Continue Shopping
                    </a>

                </div>

            </div>

        </div>

    </main>



    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">

                <p>
                    &copy; 2026 ChemistBoys.
                    All rights reserved.
                </p>

            </div>

        </div>

    </footer>



    <!-- =================================================
         CART JAVASCRIPT
    ================================================== -->

  <script src="products.js"></script>
<script type="module" src="cart.js"></script>


</body>

</html>
