<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - ChemistBoys</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .cart-page {
            min-height: 70vh;
            padding: 50px 0;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }

        .cart-items,
        .cart-summary {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 22px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0, 80, 70, 0.08);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px 0;
            border-bottom: 1px solid #e4efed;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-image {
            width: 100px;
            height: 100px;
            background: #effaf8;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-item-image img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h3 {
            margin-bottom: 8px;
        }

        .cart-price {
            color: #087c6b;
            font-weight: bold;
            font-size: 18px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .quantity-control button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            background: #e5f7f3;
            color: #087c6b;
            font-size: 18px;
            cursor: pointer;
        }

        .quantity-control button:hover {
            background: #0ca88f;
            color: white;
        }

        .remove-btn {
            border: none;
            background: #ffe8ec;
            color: #e63b59;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #e63b59;
            color: white;
        }

        .cart-summary h2 {
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            color: #58716e;
        }

        .summary-total {
            border-top: 1px solid #dceae7;
            margin-top: 10px;
            padding-top: 18px;
            font-size: 21px;
            font-weight: bold;
            color: #075f55;
        }

        .checkout-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 13px;
            background: #0ca88f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .checkout-btn:hover {
            background: #075f55;
            transform: translateY(-3px);
        }

        .continue-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #0ca88f;
            font-weight: bold;
        }

        .empty-cart {
            text-align: center;
            padding: 70px 20px;
        }

        .empty-cart-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .empty-cart h2 {
            margin-bottom: 10px;
        }

        @media (max-width: 800px) {

            .cart-layout {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 550px) {

            .cart-item {
                align-items: flex-start;
            }

            .cart-item-image {
                width: 75px;
                height: 75px;
            }

            .remove-btn {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="container">

            <div class="header-top">

                <div class="logo">
                    <span class="logo-icon">💊</span>
                    <span class="logo-text">ChemistBoys</span>
                </div>

                <div class="header-actions">

                    <a href="index.html" class="account-btn">
                        🏠 Home
                    </a>

                    <a href="cart.html" class="cart-btn">
                        🛒 Cart
                        <span class="cart-count" id="cartCount">
                            0
                        </span>
                    </a>

                </div>

            </div>

        </div>

    </header>


    <!-- CART -->

    <main class="cart-page">

        <div class="container">

            <h1 class="section-title">
                Your Shopping Cart
            </h1>

            <div class="cart-layout">

                <!-- ITEMS -->

                <div class="cart-items">

                    <div id="cartItems">
                        <!-- Items inserted by cart.js -->
                    </div>

                </div>


                <!-- SUMMARY -->

                <div class="cart-summary">

                    <h2>Order Summary</h2>

                    <div class="summary-row">

                        <span>Subtotal</span>

                        <span id="subtotal">
                            ₹0
                        </span>

                    </div>

                    <div class="summary-row">

                        <span>Delivery</span>

                        <span id="delivery">
                            ₹0
                        </span>

                    </div>

                    <div class="summary-row summary-total">

                        <span>Total</span>

                        <span id="total">
                            ₹0
                        </span>

                    </div>

                    <button
                        class="checkout-btn"
                        id="checkoutBtn">
                        💳 Proceed to Checkout
                    </button>

                    <a
                        href="index.html"
                        class="continue-btn">
                        ← Continue Shopping
                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">

                <p>
                    © 2026 ChemistBoys. All rights reserved.
                </p>

            </div>

        </div>

    </footer>


    <script src="cart.js"></script>

</body>

</html>
