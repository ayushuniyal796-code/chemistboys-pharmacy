<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - ChemistBoys</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="container">

            <div class="header-top">

                <a href="index.html" class="logo-link">

                    <div class="logo">
                        <span class="logo-icon">💊</span>
                        <span class="logo-text">ChemistBoys</span>
                    </div>

                </a>

                <div class="header-actions">

                    <a href="index.html" class="account-btn">
                        🏠 Home
                    </a>

                    <a href="orders.html" class="account-btn">
                        📦 My Orders
                    </a>

                </div>

            </div>

            <nav class="navbar">

                <a href="index.html" class="nav-link">
                    Home
                </a>

                <a href="index.html" class="nav-link">
                    All Medicines
                </a>

                <a href="index.html" class="nav-link">
                    Vitamins
                </a>

                <a href="index.html" class="nav-link">
                    First Aid
                </a>

                <a href="index.html" class="nav-link">
                    Offers
                </a>

            </nav>

        </div>

    </header>


    <!-- CART -->
    <main class="cart-page">

        <div class="container">

            <h1 class="cart-title">
                🛒 Your Shopping Cart
            </h1>


            <div class="cart-layout">


                <!-- CART ITEMS -->

                <div class="cart-card">

                    <h2>
                        Your Items
                    </h2>

                    <div id="cartItems">
                        <!-- Products loaded by cart.js -->
                    </div>

                </div>


                <!-- ORDER SUMMARY -->

                <div class="cart-card">

                    <h2>
                        Order Summary
                    </h2>


                    <div class="summary-row">

                        <span>
                            Items
                        </span>

                        <strong id="totalItems">
                            0
                        </strong>

                    </div>


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <strong id="subtotal">
                            ₹0
                        </strong>

                    </div>


                    <div class="summary-row">

                        <span>
                            Delivery
                        </span>

                        <strong id="deliveryCharge">
                            FREE
                        </strong>

                    </div>


                    <div class="summary-total">

                        <span>
                            Total
                        </span>

                        <span id="grandTotal">
                            ₹0
                        </span>

                    </div>


                    <a
                        href="checkout.html"
                        class="checkout-btn"
                        id="checkoutBtn"
                    >
                        🔒 Proceed to Checkout
                    </a>


                    <a
                        href="index.html"
                        class="continue-btn"
                    >
                        ← Continue Shopping
                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">

                <p>
                    &copy; 2026 ChemistBoys.
                    All rights reserved.
                </p>

            </div>

        </div>

    </footer>


    <!-- CART JS -->

    <script src="cart.js"></script>

</body>

</html>
