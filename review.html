<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reviews - ChemistBoys</title>

    <link rel="stylesheet" href="review.css">
</head>

<body>

    <header class="review-header">
        <a href="index.html" class="logo">💊 ChemistBoys</a>

        <a href="index.html" class="back-btn">
            ← Back to Home
        </a>
    </header>

    <main class="review-page">

        <!-- REVIEW FORM -->
        <section class="review-hero">

            <div class="hero-icon">⭐</div>

            <h1>Share Your Experience</h1>

            <p>
                Your feedback helps us improve ChemistBoys.
            </p>

            <div class="review-box">

                <h2>How was your experience?</h2>

                <!-- STAR RATING -->
                <div class="star-rating" id="starRating">

                    <button type="button" data-rating="1">★</button>
                    <button type="button" data-rating="2">★</button>
                    <button type="button" data-rating="3">★</button>
                    <button type="button" data-rating="4">★</button>
                    <button type="button" data-rating="5">★</button>

                </div>

                <p class="rating-text" id="ratingText">
                    Select a rating
                </p>

                <textarea
                    id="reviewText"
                    maxlength="500"
                    placeholder="Write your review here..."
                ></textarea>

                <div class="char-count">
                    <span id="charCount">0</span>/500
                </div>

                <button
                    type="button"
                    id="submitReview"
                    class="submit-btn"
                >
                    ⭐ Submit Review
                </button>

                <p id="reviewMessage" class="message"></p>

            </div>

        </section>


        <!-- REVIEWS -->
        <section class="reviews-section">

            <div class="section-heading">

                <div>
                    <h2>What Our Customers Say</h2>
                    <p>Real reviews from ChemistBoys customers.</p>
                </div>

                <div class="average-rating" id="averageRating">
                    ⭐ <span id="averageNumber">0.0</span>
                </div>

            </div>

            <div id="reviewsList" class="reviews-list">

                <div class="loading">
                    Loading reviews...
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 ChemistBoys. All rights reserved.</p>
    </footer>


    <script type="module" src="review.js?v=1"></script>

</body>
</html>
