<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Track Delivery - ChemistBoys</title>

    <!-- Leaflet Map CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f9f8;
            color: #164e49;
        }

        header {
            background: #075f55;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
            font-size: 21px;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            background: rgba(255,255,255,0.15);
            padding: 9px 14px;
            border-radius: 8px;
            font-weight: 700;
        }

        .container {
            width: min(1000px, 94%);
            margin: 25px auto;
        }

        .tracking-box {
            background: white;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .tracking-box h1 {
            margin-top: 0;
            font-size: 25px;
        }

        .tracking-box p {
            color: #667b78;
            line-height: 1.6;
        }

        .order-input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbdedb;
            border-radius: 9px;
            font-size: 15px;
            margin-top: 10px;
        }

        .track-btn {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #075f55;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .track-btn:hover {
            background: #064d46;
        }

        .status-box {
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            background: #edf8f6;
            color: #075f55;
            font-weight: 700;
        }

        #map {
            width: 100%;
            height: 500px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .info-box {
            background: white;
            padding: 20px;
            border-radius: 18px;
            margin-top: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .info-box h3 {
            margin-top: 0;
        }

        .location-info {
            color: #667b78;
            line-height: 1.7;
        }

        @media (max-width: 600px) {

            .container {
                width: 94%;
                margin: 18px auto;
            }

            #map {
                height: 400px;
            }

            header h2 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <header>

        <h2>💊 ChemistBoys</h2>

        <a
            href="orders.html"
            class="back-btn"
        >
            ← My Orders
        </a>

    </header>


    <main class="container">

        <div class="tracking-box">

            <h1>📍 Live Delivery Tracking</h1>

            <p>
                Track your accepted order and see the delivery
                person's live location on the map.
            </p>

            <input
                type="text"
                id="orderIdInput"
                class="order-input"
                placeholder="Enter your Order ID"
            >

            <button
                id="trackBtn"
                class="track-btn"
            >
                Track My Delivery
            </button>

            <div
                id="trackingStatus"
                class="status-box"
            >
                Enter your order ID to start tracking.
            </div>

        </div>


        <!-- LIVE MAP -->

        <div id="map"></div>


        <div class="info-box">

            <h3>🚚 Delivery Information</h3>

            <div
                id="locationInfo"
                class="location-info"
            >
                Waiting for delivery location...
            </div>

        </div>

    </main>


    <!-- Leaflet Map JS -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- Firebase / Tracking JS -->

    <script
        type="module"
        src="track-order.js"
    ></script>

</body>

</html>
