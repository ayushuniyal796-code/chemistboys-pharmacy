<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - ChemistBoys</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f9f8;
            color: #164e49;
        }
        header {
            background: #075f55;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h2 { margin: 0; font-size: 21px; }
        .back-btn {
            text-decoration: none;
            color: white;
            background: rgba(255,255,255,.15);
            padding: 9px 14px;
            border-radius: 8px;
            font-weight: 700;
        }
        .container { width: min(760px, 94%); margin: 25px auto; }
        .tracking-box, .timeline-box {
            background: white;
            padding: 24px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
            margin-bottom: 20px;
        }
        .tracking-box h1 { margin: 0 0 8px; font-size: 25px; }
        .tracking-box p { color: #667b78; line-height: 1.6; }
        .order-input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbdedb;
            border-radius: 9px;
            font-size: 15px;
            margin-top: 10px;
        }
        .track-btn {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #075f55;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .status-box {
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            background: #edf8f6;
            color: #075f55;
            font-weight: 700;
        }
        .timeline-box h2 { margin-top: 0; }
        .timeline { margin-top: 25px; }
        .timeline-step {
            position: relative;
            display: flex;
            gap: 16px;
            min-height: 78px;
        }
        .timeline-step:not(:last-child)::before {
            content: "";
            position: absolute;
            left: 14px;
            top: 31px;
            bottom: 0;
            width: 2px;
            background: #d9e8e5;
        }
        .timeline-dot {
            position: relative;
            z-index: 1;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef3f2;
            color: #7b8c89;
            font-weight: 800;
            flex: 0 0 30px;
        }
        .timeline-step.completed .timeline-dot,
        .timeline-step.active .timeline-dot {
            background: #0ca88f;
            color: white;
        }
        .timeline-step.completed:not(:last-child)::before,
        .timeline-step.active:not(:last-child)::before {
            background: #0ca88f;
        }
        .timeline-content {
            padding-top: 3px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .timeline-content strong { font-size: 16px; }
        .timeline-content span { color: #718987; font-size: 13px; }
        @media (max-width: 600px) {
            .container { width: 94%; margin: 18px auto; }
            header h2 { font-size: 18px; }
        }
    </style>
</head>
<body>
    <header>
        <h2>💊 ChemistBoys</h2>
        <a href="orders.html" class="back-btn">← My Orders</a>
    </header>

    <main class="container">
        <div class="tracking-box">
            <h1>📦 Track Your Order</h1>
            <p>See the current delivery status of your accepted order.</p>

            <input type="text" id="orderIdInput" class="order-input" placeholder="Enter your Order ID">
            <button id="trackBtn" class="track-btn">Track My Order</button>

            <div id="trackingStatus" class="status-box">Enter your Order ID to see delivery status.</div>
        </div>

        <div class="timeline-box">
            <h2>🚚 Delivery Status</h2>
            <div id="trackingTimeline" class="timeline"></div>
        </div>
    </main>

    <script type="module" src="track-order.js"></script>
</body>
</html>
