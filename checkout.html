<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout - ChemistBoys</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>
        .checkout-page {
            min-height: 70vh;
            padding: 50px 0;
            background: #f5fbfa;
        }

        .checkout-title {
            text-align: center;
            color: #075f55;
            margin-bottom: 35px;
        }

        .checkout-layout {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 25px;
        }

        .checkout-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 80, 70, 0.08);
            margin-bottom: 20px;
        }

        .checkout-card h2 {
            color: #075f55;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #365853;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8e9e6;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #0ca88f;
        }

        .delivery-options {
            display: grid;
            gap: 10px;
        }

        .delivery-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px;
            border: 1px solid #d8e9e6;
            border-radius: 10px;
            cursor: pointer;
        }

        .delivery-option:hover {
            border-color: #0ca88f;
            background: #f3fbf9;
        }

        .delivery-option input {
            width: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 13px 0;
            border-bottom: 1px solid #edf3f2;
        }

        .cart-item-name {
            font-weight: 600;
            color: #365853;
        }

        .cart-item-price {
            font-weight: 700;
            color: #075f55;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 9px 0;
            color: #526d69;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #dceae7;
            margin-top: 12px;
            padding-top: 15px;
            font-size: 21px;
            font-weight: 800;
            color: #075f55;
        }

        .place-order-btn {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            background: #0ca88f;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .place-order-btn:hover {
            background: #087c6b;
            transform: translateY(-2px);
        }

        .empty-cart {
            max-width: 600px;
            margin: 60px auto;
            text-align: center;
            background: white;
            padding: 50px 25px;
            border-radius: 20px;
        }

        .empty-cart-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .continue-shopping {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            border-radius: 10px;
            background: #0ca88f;
            color: white;
            font-weight: 700;
        }

        @media (max-width: 750px) {
            .checkout-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="container">

            <div class="header-top">

                <a
                    href="index.html"
                    class="logo-link"
                >
                    <div class="logo">

                        <span class="logo-icon">💊</span>

                        <span class="logo-text">
                            ChemistBoys
                        </span>

                    </div>
                </a>

                <div class="header-actions">

                    <a
                        href="index.html"
                        class="account-btn"
                    >
                        🏠 Home
                    </a>

                    <a
                        href="cart.html"
                        class="cart-btn"
                    >
                        🛒 Cart
                    </a>

                </div>

            </div>

        </div>

    </header>


    <!-- CHECKOUT -->

    <main class="checkout-page">

        <div class="container">

            <h1 class="checkout-title">
                🛍️ Secure Checkout
            </h1>


            <form
                id="checkoutForm"
                class="checkout-layout"
            >


                <!-- LEFT SIDE -->

                <div>


                    <!-- CUSTOMER DETAILS -->

                    <div class="checkout-card">

                        <h2>
                            👤 Delivery Details
                        </h2>


                        <div class="form-group">

                            <label for="customerName">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="customerName"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="customerPhone">
                                Mobile Number
                            </label>

                            <input
                                type="tel"
                                id="customerPhone"
                                placeholder="Enter 10-digit mobile number"
                                maxlength="10"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="customerAddress">
                                Delivery Address
                            </label>

                            <textarea
                                id="customerAddress"
                                placeholder="House no., street, area..."
                                required
                            ></textarea>

                        </div>


                        <div class="form-group">

                            <label for="customerCity">
                                City
                            </label>

                            <input
                                type="text"
                                id="customerCity"
                                placeholder="Enter city"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="customerPincode">
                                Pincode
                            </label>

                            <input
                                type="text"
                                id="customerPincode"
                                placeholder="Enter 6-digit pincode"
                                maxlength="6"
                                required
                            >

                        </div>

                    </div>



                    <!-- DELIVERY DATE -->

                    <div class="checkout-card">

                        <h2>
                            🚚 Choose Delivery Date
                        </h2>

                        <p>
                            Select your preferred available delivery date.
                        </p>

                        <br>

                        <div
                            class="delivery-options"
                            id="deliveryOptions"
                        ></div>

                    </div>



                    <!-- PAYMENT -->

                    <div class="checkout-card">

                        <h2>
                            💳 Payment Method
                        </h2>

                        <div class="form-group">

                            <label for="paymentMethod">
                                Select Payment Method
                            </label>

                            <select
                                id="paymentMethod"
                                required
                            >

                                <option value="">
                                    Select payment method
                                </option>

                                <option value="cod">
                                    Cash on Delivery
                                </option>

                                <option value="online">
                                    Online Payment
                                </option>

                            </select>

                        </div>

                    </div>

                </div>



                <!-- RIGHT SIDE -->

                <div>

                    <div class="checkout-card">

                        <h2>
                            🛒 Order Summary
                        </h2>


                        <div
                            id="checkoutItems"
                        ></div>


                        <div class="price-row">

                            <span>
                                Subtotal
                            </span>

                            <strong id="subtotal">
                                ₹0
                            </strong>

                        </div>


                        <div class="price-row">

                            <span>
                                Delivery
                            </span>

                            <strong id="deliveryCharge">
                                ₹0
                            </strong>

                        </div>


                        <div class="total-row">

                            <span>
                                Total
                            </span>

                            <span id="grandTotal">
                                ₹0
                            </span>

                        </div>


                        <br>


                        <button
                            type="submit"
                            class="place-order-btn"
                        >
                            🔒 Place Order
                        </button>

                    </div>

                </div>


            </form>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">

                <p>
                    &copy; 2026 ChemistBoys.
                    All rights reserved.
                </p>

            </div>

        </div>

    </footer>


    <script src="checkout.js"></script>

</body>

</html>
