<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout - ChemistBoys</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="header">

        <div class="container">

            <div class="header-top">


                <!-- LOGO -->

                <a
                    href="index.html"
                    class="logo-link"
                >

                    <div class="logo">

                        <span class="logo-icon">
                            💊
                        </span>

                        <span class="logo-text">
                            ChemistBoys
                        </span>

                    </div>

                </a>


                <!-- HEADER ACTIONS -->

                <div class="header-actions">

                    <a
                        href="index.html"
                        class="account-btn"
                    >
                        🏠 Home
                    </a>


                    <a
                        href="orders.html"
                        class="account-btn"
                    >
                        📦 My Orders
                    </a>

                </div>

            </div>


            <!-- NAVIGATION -->

            <nav class="navbar">

                <a
                    href="index.html"
                    class="nav-link"
                >
                    Home
                </a>


                <a
                    href="index.html#products"
                    class="nav-link"
                >
                    All Medicines
                </a>


                <a
                    href="index.html#vitamins"
                    class="nav-link"
                >
                    Vitamins
                </a>


                <a
                    href="index.html#firstaid"
                    class="nav-link"
                >
                    First Aid
                </a>


                <a
                    href="index.html#offers"
                    class="nav-link"
                >
                    Offers
                </a>


                <a
                    href="about.html"
                    class="nav-link"
                >
                    About
                </a>

            </nav>

        </div>

    </header>



    <!-- =================================================
         CHECKOUT PAGE
    ================================================== -->

    <main class="cart-page">

        <div class="container">


            <!-- PAGE TITLE -->

            <h1 class="cart-title">
                🛒 Checkout
            </h1>



            <div class="cart-layout">


                <!-- =================================================
                     LEFT SIDE
                     CUSTOMER DETAILS + CART ITEMS
                ================================================== -->

                <div>


                    <!-- =================================================
                         CUSTOMER DETAILS
                    ================================================== -->

                    <div class="cart-card">

                        <h2>
                            👤 Customer Details
                        </h2>


                        <form
                            id="checkoutForm"
                        >


                            <!-- NAME -->

                            <div class="form-group">

                                <label for="customerName">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="customerName"
                                    name="customerName"
                                    placeholder="Enter your full name"
                                    required
                                >

                            </div>



                            <!-- EMAIL -->

                            <div class="form-group">

                                <label for="customerEmail">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="customerEmail"
                                    name="customerEmail"
                                    placeholder="Enter your email"
                                    required
                                >

                            </div>



                            <!-- PHONE -->

                            <div class="form-group">

                                <label for="customerPhone">
                                    Mobile Number
                                </label>

                                <input
                                    type="tel"
                                    id="customerPhone"
                                    name="customerPhone"
                                    placeholder="Enter 10-digit mobile number"
                                    pattern="[0-9]{10}"
                                    maxlength="10"
                                    required
                                >

                            </div>



                            <!-- ADDRESS -->

                            <div class="form-group">

                                <label for="customerAddress">
                                    Delivery Address
                                </label>

                                <textarea
                                    id="customerAddress"
                                    name="customerAddress"
                                    placeholder="House no., street, area..."
                                    rows="3"
                                    required
                                ></textarea>

                            </div>



                            <!-- CITY -->

                            <div class="form-group">

                                <label for="customerCity">
                                    City
                                </label>

                                <input
                                    type="text"
                                    id="customerCity"
                                    name="customerCity"
                                    placeholder="Enter your city"
                                    required
                                >

                            </div>



                            <!-- PINCODE -->

                            <div class="form-group">

                                <label for="customerPincode">
                                    Pincode
                                </label>

                                <input
                                    type="text"
                                    id="customerPincode"
                                    name="customerPincode"
                                    placeholder="6-digit pincode"
                                    pattern="[0-9]{6}"
                                    maxlength="6"
                                    required
                                >

                            </div>


                        </form>

                    </div>



                    <!-- =================================================
                         CART ITEMS
                    ================================================== -->

                    <div class="cart-card">

                        <h2>
                            🛍️ Your Items
                        </h2>


                        <div id="checkoutItems">

                            <!-- Products loaded by checkout.js -->

                        </div>

                    </div>



                    <!-- =================================================
                         PAYMENT METHOD
                    ================================================== -->

                    <div class="cart-card">

                        <h2>
                            💳 Payment Method
                        </h2>


                        <div class="form-group">

                            <label for="paymentMethod">
                                Choose Payment Method
                            </label>


                            <select
                                id="paymentMethod"
                                name="paymentMethod"
                                required
                            >

                                <option value="">
                                    Select Payment Method
                                </option>

                                <option value="cod">
                                    💵 Cash on Delivery
                                </option>

                                <option value="upi">
                                    📱 UPI
                                </option>

                                <option value="card">
                                    💳 Debit / Credit Card
                                </option>

                            </select>

                        </div>

                    </div>


                </div>



                <!-- =================================================
                     RIGHT SIDE
                     ORDER SUMMARY
                ================================================== -->

                <div class="cart-card">

                    <h2>
                        🛒 Order Summary
                    </h2>



                    <!-- SUBTOTAL -->

                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <strong id="subtotal">
                            ₹0
                        </strong>

                    </div>



                    <!-- DELIVERY -->

                    <div class="summary-row">

                        <span>
                            Delivery
                        </span>

                        <strong id="deliveryCharge">
                            FREE
                        </strong>

                    </div>



                    <!-- SEPARATOR -->

                    <div
                        style="
                            border-top:1px solid #e5e5e5;
                            margin:18px 0;
                        "
                    ></div>



                    <!-- TOTAL -->

                    <div class="summary-total">

                        <span>
                            Total
                        </span>

                        <span id="grandTotal">
                            ₹0
                        </span>

                    </div>



                    <!-- =================================================
                         PLACE ORDER
                    ================================================== -->

                    <button
                        type="submit"
                        form="checkoutForm"
                        class="checkout-btn"
                        id="placeOrderBtn"
                        style="
                            width:100%;
                            border:none;
                            cursor:pointer;
                            margin-top:20px;
                        "
                    >
                        ✅ Place Order
                    </button>



                    <!-- BACK TO CART -->

                    <a
                        href="cart.html"
                        class="continue-btn"
                    >
                        ← Back to Cart
                    </a>

                </div>

            </div>

        </div>

    </main>



    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">

                <p>
                    &copy; 2026 ChemistBoys.
                    All rights reserved.
                </p>

            </div>

        </div>

    </footer>



    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <!-- IMPORTANT:
         products.js must load BEFORE checkout.js
         so checkout.js can find product prices.
    -->

    <script src="products.js"></script>

    <script
        type="module"
        src="checkout.js"
    ></script>


</body>

</html>
